name: Python-CI-CD

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  python-test:
    name: Python Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pytest -v


  docker-build-push:
    name: Docker Build and Push
    needs: python-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mayuri67/python-argocd:latest
            mayuri67/python-argocd:${{ github.sha }}

      - name: Update Helm Image Tag
        run: |
          sed -i "s/^  tag: .*/  tag: ${{ github.sha }}/" helm/python-app/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/python-app/values.yaml
          git commit -m "Update Python image to ${{ github.sha }}" || exit 0
          git push